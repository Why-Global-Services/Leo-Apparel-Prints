<!DOCTYPE html>
<html>
<head>
    <title>GLB Test</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #info { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 8px; font-family: monospace; z-index: 100; }
    </style>
</head>
<body>
    <div id="info">Testing GLB file...</div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xE2E8F0);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 2, 5);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1;
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(5, 10, 7);
        scene.add(mainLight);
        
        // Try to load GLB
        const loader = new GLTFLoader();
        const glbPath = '/images/jerseys/jersey.glb';
        
        document.getElementById('info').innerHTML = `Loading: ${glbPath}...`;
        
        loader.load(
            glbPath,
            (gltf) => {
                document.getElementById('info').innerHTML = '✅ GLB loaded successfully!';
                const model = gltf.scene;
                scene.add(model);
                
                // Center model
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                model.position.sub(center);
                
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 2.5 / maxDim;
                model.scale.set(scale, scale, scale);
                
                controls.target.set(0, 0, 0);
                controls.update();
            },
            (progress) => {
                const percent = (progress.loaded / progress.total) * 100;
                document.getElementById('info').innerHTML = `Loading: ${percent.toFixed(1)}%`;
            },
            (error) => {
                document.getElementById('info').innerHTML = `❌ Error: ${error.message}`;
                console.error(error);
            }
        );
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
