<!DOCTYPE html>
<html>
<head>
    <title>GLB Test</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            z-index: 100;
            font-size: 14px;
            pointer-events: none;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">Loading GLB file...</div>
    <div id="controls">🖱️ Drag to rotate | Scroll to zoom</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        
        // Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xE2E8F0);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 1.5, 3);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1;
        controls.enableZoom = true;
        controls.target.set(0, 0.5, 0);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(5, 10, 7);
        mainLight.castShadow = true;
        scene.add(mainLight);
        
        const fillLight = new THREE.PointLight(0xffffff, 0.4);
        fillLight.position.set(0, -1, 0);
        scene.add(fillLight);
        
        const backLight = new THREE.PointLight(0xffaa66, 0.5);
        backLight.position.set(0, 1, -2);
        scene.add(backLight);
        
        // Grid helper
        const gridHelper = new THREE.GridHelper(5, 20, 0x888888, 0xcccccc);
        gridHelper.position.y = -0.8;
        scene.add(gridHelper);
        
        // Test cube (remove after GLB loads)
        const testCube = new THREE.Mesh(
            new THREE.BoxGeometry(0.5, 0.5, 0.5),
            new THREE.MeshStandardMaterial({ color: 0xff6600 })
        );
        testCube.position.set(0, 0.5, 0);
        scene.add(testCube);
        
        // Load GLB
        const loader = new GLTFLoader();
        const glbPath = '/images/jerseys/jersey.glb';
        
        document.getElementById('info').innerHTML = `📦 Loading: ${glbPath}`;
        
        loader.load(
            glbPath,
            (gltf) => {
                const model = gltf.scene;
                document.getElementById('info').innerHTML = '✅ GLB loaded successfully!';
                
                // Remove test cube
                scene.remove(testCube);
                
                // Calculate bounding box
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                console.log('Model size:', size);
                console.log('Model center:', center);
                
                // Center and scale
                model.position.sub(center);
                model.position.y += 0.5;
                
                const maxDim = Math.max(size.x, size.y, size.z);
                if (maxDim > 2 || maxDim < 0.5) {
                    const scale = 1.2 / maxDim;
                    model.scale.set(scale, scale, scale);
                    console.log('Scaled model by:', scale);
                }
                
                // Enable shadows
                model.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });
                
                scene.add(model);
                
                // Adjust camera
                const distance = maxDim * 1.5;
                camera.position.set(distance, distance * 0.6, distance);
                controls.target.set(0, 0.5, 0);
                controls.update();
                
                setTimeout(() => {
                    document.getElementById('info').style.opacity = '0.5';
                }, 3000);
            },
            (progress) => {
                const percent = (progress.loaded / progress.total) * 100;
                document.getElementById('info').innerHTML = `📦 Loading: ${percent.toFixed(0)}%`;
            },
            (error) => {
                console.error('Error:', error);
                document.getElementById('info').innerHTML = '❌ Failed to load GLB file';
                document.getElementById('info').style.backgroundColor = 'rgba(220, 38, 38, 0.9)';
            }
        );
        
        // Animation
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
