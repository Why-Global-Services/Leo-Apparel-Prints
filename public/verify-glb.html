<!DOCTYPE html>
<html>
<head>
    <title>3D Jersey Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: system-ui; }
        #info {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            color: white;
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 12px;
            pointer-events: none;
            z-index: 100;
            font-family: monospace;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            background: rgba(255,255,255,0.9);
            padding: 24px 32px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #E8820C;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .controls-hint {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            color: white;
            pointer-events: none;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="color:#E8820C; font-size:14px; font-weight:600; margin:0;">Loading 3D Model...</p>
        <p style="color:#64748B; font-size:12px; margin-top:8px;">Drag to rotate 360° | Scroll to zoom</p>
    </div>
    <div id="info">Initializing...</div>
    <div class="controls-hint">🖱️ Drag to rotate | 🔍 Scroll to zoom</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const glbPath = urlParams.get('path') || '/images/jerseys/jersey.glb';
        const autoRotate = urlParams.get('autoRotate') !== 'false';
        const rotationSpeed = parseFloat(urlParams.get('speed')) || 0.005;
        const backgroundColor = urlParams.get('bg') || '#E2E8F0';
        
        const loadingDiv = document.getElementById('loading');
        const infoDiv = document.getElementById('info');
        
        // Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(backgroundColor);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(0, 0.4, 1.2);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = autoRotate;
        controls.autoRotateSpeed = rotationSpeed * 100;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.zoomSpeed = 1.2;
        controls.target.set(0, 0.2, 0);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(5, 10, 7);
        mainLight.castShadow = true;
        scene.add(mainLight);
        
        const fillLight = new THREE.PointLight(0xffffff, 0.5);
        fillLight.position.set(0, 0.5, 0);
        scene.add(fillLight);
        
        const backLight = new THREE.PointLight(0xffaa66, 0.4);
        backLight.position.set(0, 0.5, -1);
        scene.add(backLight);
        
        const leftLight = new THREE.PointLight(0x88aaff, 0.3);
        leftLight.position.set(-1, 0.3, 0.5);
        scene.add(leftLight);
        
        const rightLight = new THREE.PointLight(0xffaa88, 0.3);
        rightLight.position.set(1, 0.3, 0.5);
        scene.add(rightLight);
        
        // Grid helper
        const gridHelper = new THREE.GridHelper(1.5, 20, 0x888888, 0xcccccc);
        gridHelper.position.y = -0.25;
        scene.add(gridHelper);
        
        // Load GLB
        const loader = new GLTFLoader();
        const fullUrl = glbPath.startsWith('http') ? glbPath : window.location.origin + glbPath;
        infoDiv.textContent = 'Loading: ' + glbPath.split('/').pop();
        
        loader.load(
            fullUrl,
            (gltf) => {
                const model = gltf.scene;
                infoDiv.innerHTML = '✅ Model loaded! Drag to rotate 360°';
                infoDiv.style.background = 'rgba(16, 185, 129, 0.8)';
                
                // Calculate bounds
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                // Position and scale
                model.position.x = -center.x;
                model.position.y = -center.y + 0.15;
                model.position.z = -center.z;
                
                const targetHeight = 0.6;
                const scale = targetHeight / size.y;
                model.scale.set(scale, scale, scale);
                
                // Improve materials
                model.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                        if (node.material) {
                            if (Array.isArray(node.material)) {
                                node.material.forEach(mat => {
                                    mat.roughness = 0.4;
                                    mat.metalness = 0.1;
                                });
                            } else {
                                node.material.roughness = 0.4;
                                node.material.metalness = 0.1;
                            }
                        }
                    }
                });
                
                scene.add(model);
                loadingDiv.style.display = 'none';
                
                controls.target.set(0, 0.2, 0);
                controls.update();
                
                // Hide info after 3 seconds
                setTimeout(() => {
                    infoDiv.style.opacity = '0.5';
                }, 3000);
            },
            (progress) => {
                const percent = (progress.loaded / progress.total) * 100;
                infoDiv.innerHTML = `📦 Loading: ${percent.toFixed(0)}%`;
            },
            (error) => {
                console.error('Error:', error);
                infoDiv.innerHTML = '❌ Failed to load model';
                infoDiv.style.background = 'rgba(239, 68, 68, 0.8)';
                loadingDiv.innerHTML = `
                    <div style="color:#EF4444; font-size:16px; margin-bottom:12px;">⚠️ Failed to Load Model</div>
                    <p style="color:#64748B; font-size:12px;">Make sure the GLB file exists at:<br>${glbPath}</p>
                    <button onclick="location.reload()" style="margin-top:16px; padding:8px 16px; background:#E8820C; color:white; border:none; border-radius:6px; cursor:pointer;">Retry</button>
                `;
            }
        );
        
        // Animation
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
